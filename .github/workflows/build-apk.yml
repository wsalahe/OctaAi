name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffolding
        run: flutter create --platforms android --project-name octaai --org dev.octaai .

      - name: Set app label and permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="OctaAi"/' "$MANIFEST"
          grep -q 'usesCleartextTraffic' "$MANIFEST" || sed -i 's|<application |<application android:usesCleartextTraffic="true" |' "$MANIFEST"
          grep -q 'permission.INTERNET' "$MANIFEST" || sed -i 's|<application |<uses-permission android:name="android.permission.INTERNET"/>\n    <application |' "$MANIFEST"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: octaai-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OctaAi build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
