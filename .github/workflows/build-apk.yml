name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Android platform scaffolding
        run: flutter create --platforms android --project-name octaai --org dev.octaai .

      - name: Set app label and permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="OctaAi"/' "$MANIFEST"
          grep -q 'android.permission.INTERNET' "$MANIFEST" || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          grep -q 'usesCleartextTraffic' "$MANIFEST" || sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
          grep -q 'android.permission.INTERNET' "$MANIFEST" || { echo 'INTERNET permission still missing'; exit 1; }
          grep -q 'flutterdownloader.DownloadedFileProvider' "$MANIFEST" || sed -i 's|</application>|    <provider android:name="vn.hunghd.flutterdownloader.DownloadedFileProvider" android:authorities="${applicationId}.flutter_downloader.provider" android:exported="false" android:grantUriPermissions="true">\n      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/provider_paths"/>\n    </provider>\n  </application>|' "$MANIFEST"
          grep -q 'flutterdownloader.DownloadedFileProvider' "$MANIFEST" || { echo 'downloader provider missing'; exit 1; }
          GRADLE=android/app/build.gradle.kts
          [ -f "$GRADLE" ] || GRADLE=android/app/build.gradle
          sed -i -E 's/compileSdk[ =]+flutter\.compileSdkVersion/compileSdk = 36/' "$GRADLE"
          sed -i -E 's/compileSdk[ =]+flutter\.compileSdkVersion/compileSdk 36/' "$GRADLE"
          grep -E 'compileSdk' "$GRADLE" | head -3
          echo '--- manifest head ---'
          head -20 "$MANIFEST"

      - name: Generate launcher icons
        run: |
          pip install pillow
          python3 tools/make_icons.py

      - name: Install Android 36 SDK platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" 'platforms;android-36' >/dev/null
          "$SDKMANAGER" 'build-tools;36.0.0' >/dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch plugin proguard rule for current AGP
        run: |
          find ~/.pub-cache -path '*flutter_inappwebview_android*/android/build.gradle' -print0 | while IFS= read -r -d '' f; do
            sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" "$f" && echo "patched $f"
          done
          find ~/.pub-cache -path '*flutter_downloader*/android/build.gradle' -print0 | while IFS= read -r -d '' f; do
            grep -q 'namespace' "$f" || { sed -i 's|^android {|android {\n    namespace "vn.hunghd.flutterdownloader"|' "$f" && echo "namespaced $f"; }
          done

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK has INTERNET permission
        run: |
          unzip -p build/app/outputs/flutter-apk/app-release.apk AndroidManifest.xml > /tmp/manifest.bin
          if strings -e l /tmp/manifest.bin | grep -q 'android.permission.INTERNET'; then
            echo 'INTERNET permission OK in built APK'
          else
            echo 'INTERNET permission MISSING in built APK'; exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: octaai-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OctaAi build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
